name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 3 * * 2,5'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent auto-pause
        run: |
          curl -s -o response.txt -w "HTTP_STATUS:%{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/?select=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "--- Response body ---"
          cat response.txt
          echo "Supabase ping 완료: $(date)"
